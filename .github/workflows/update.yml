name: Update data

on:
  schedule:
    # Run every week, not only at the end of month, because the data may
    # be released later when the last day of month is a holiday.
    # 14:00 UTC on Wednesday is 23:00 JST.
    - cron: "0 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
      - name: Download data
        run: python3 update.py > "$RUNNER_TEMP/commit-message.txt"
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          # The id comes from https://api.github.com/users/github-actions%5Bbot%5D
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md jigyosyo.zip ken_all.zip utf_ken_all.zip
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
